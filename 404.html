<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090B">
  <title>Page Not Found — DFASH Express Logistics Services</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/svg/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem var(--gutter);
      text-align: center;
    }
    .error-card {
      max-width: 540px;
      padding: clamp(2rem, 5vw, 3rem);
      background: var(--bg-elevated);
      border: 1px solid var(--gold-border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
    }
    .error-logo {
      margin: 0 auto 1.5rem;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 6.5rem);
      font-weight: 800;
      line-height: 0.95;
      color: var(--gold-primary);
      margin-bottom: 0.5rem;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.85rem;
      margin-top: 1.75rem;
    }
  </style>
</head>
<body>
  <main class="error-shell">
    <div class="error-card">
      <img class="error-logo" src="assets/svg/logo-placeholder.svg" alt="D-Fash Express Logistics Services" width="245" height="48">
      <p class="error-code">404</p>
      <h1 class="section-title">Route Not Found</h1>
      <p class="section-body">
        The page you are looking for has moved or does not exist. Return to our main page to book local Ibadan dispatch, e-commerce fulfilment, or international air cargo.
      </p>
      <div class="error-actions">
        <a class="btn btn-gold" href="index.html">
          <span>Back to Homepage</span>
          <span class="btn-arrow-box" aria-hidden="true">
            <svg class="icon icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </span>
        </a>
        <a class="btn btn-outline-light" href="https://wa.me/2349067270530?text=Hello%20D-Fash%20Express%2C%20I%20need%20help%20booking%20a%20delivery." target="_blank" rel="noopener noreferrer">
          WhatsApp Dispatch
        </a>
      </div>
    </div>
  </main>
</body>
</html>
